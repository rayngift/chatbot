<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Chatbot BILINGUE</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --ai-gradient: linear-gradient(135deg, #00b4db 0%, #0083b0 100%);
      --neon-glow: 0 0 20px rgba(0, 180, 219, 0.5);
      --glass-bg: rgba(255, 255, 255, 0.15);
      --glass-border: rgba(255, 255, 255, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: 
        linear-gradient(135deg, rgba(0, 180, 219, 0.85) 0%, rgba(0, 131, 176, 0.85) 100%),
        url('https://media.gettyimages.com/id/1315388795/video/flying-through-emerging-digital-structures-blue-loopable-data-network-virtual-reality-quantum.jpg?s=640x640&k=20&c=hdkhbV8ok9ChmaeU2mSL99nRkXgEcq3lhScDsd3uXGA=') center/cover fixed;
      min-height: 100vh;
      margin: 0; 
      padding: 0;
      display: flex; 
      align-items: center; 
      justify-content: center;
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
      animation: backgroundPan 30s linear infinite;
      position: relative;
      overflow: hidden;
    }

    @keyframes backgroundPan {
      0% { background-position: 0% center; }
      100% { background-position: 100% center; }
    }

    /* Overlay pour l'historique */
    .history-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      z-index: 1000;
      display: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .history-overlay.active {
      display: flex;
      opacity: 1;
      align-items: center;
      justify-content: center;
    }

    .history-panel {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      width: 90%;
      max-width: 800px;
      height: 80vh;
      padding: 20px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      animation: historySlideIn 0.3s ease-out;
    }

    @keyframes historySlideIn {
      from {
        opacity: 0;
        transform: translateY(-50px) scale(0.9);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid #e0e0e0;
    }

    .history-header h2 {
      color: #2d3748;
      font-size: 24px;
    }

    .history-close {
      background: #ff4757;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .history-close:hover {
      background: #ff3742;
      transform: scale(1.05);
    }

    .history-content {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .history-stats {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .history-stats h3 {
      margin-bottom: 10px;
      font-size: 18px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }

    .stat-item {
      text-align: center;
      padding: 10px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 8px;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .stat-label {
      font-size: 12px;
      opacity: 0.9;
    }

    .history-messages {
      background: white;
      border-radius: 10px;
      padding: 15px;
      max-height: 400px;
      overflow-y: auto;
    }

    .history-message {
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 10px;
      border-left: 4px solid transparent;
    }

    .history-message.user {
      background: #e3f2fd;
      border-left-color: #2196f3;
      margin-left: 20px;
    }

    .history-message.assistant {
      background: #f3e5f5;
      border-left-color: #9c27b0;
      margin-right: 20px;
    }

    .history-message .timestamp {
      font-size: 11px;
      color: #666;
      margin-bottom: 5px;
    }

    .history-message .content {
      color: #333;
      line-height: 1.4;
    }

    .history-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .history-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .history-btn.export {
      background: linear-gradient(135deg, #00b894, #00a085);
      color: white;
    }

    .history-btn.clear {
      background: linear-gradient(135deg, #ff7675, #ff5252);
      color: white;
    }

    .history-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .container {
      width: 100%; 
      max-width: 510px; 
      height: 96vh; 
      background: var(--glass-bg);
      backdrop-filter: blur(25px);
      border-radius: 25px;
      box-shadow: 
        0 25px 50px rgba(0, 0, 0, 0.25),
        0 0 0 1px var(--glass-border),
        var(--neon-glow);
      overflow: hidden;
      display: flex; 
      flex-direction: column;
      position: relative;
      border: 1px solid var(--glass-border);
      animation: containerAppear 1s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                 containerGlow 3s ease-in-out infinite alternate;
      z-index: 2;
    }

    @keyframes containerAppear {
      0% { 
        opacity: 0;
        transform: scale(0.8) translateY(50px) rotateX(10deg);
      }
      100% { 
        opacity: 1;
        transform: scale(1) translateY(0) rotateX(0);
      }
    }

    @keyframes containerGlow {
      0% { box-shadow: 
        0 25px 50px rgba(0, 0, 0, 0.25),
        0 0 0 1px var(--glass-border),
        0 0 20px rgba(0, 180, 219, 0.5); }
      100% { box-shadow: 
        0 25px 50px rgba(0, 0, 0, 0.25),
        0 0 0 1px var(--glass-border),
        0 0 40px rgba(0, 180, 219, 0.8); }
    }

    .header {
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      color: white; 
      padding: 25px 20px;
      text-align: center;
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid var(--glass-border);
    }

    .header::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: shimmer 4s infinite;
    }

    @keyframes shimmer {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    .header h2 {
      font-size: 28px; 
      line-height: 1.1; 
      margin-bottom: 8px;
      font-weight: 700; 
      letter-spacing: 0.3px;
      text-shadow: 0 2px 15px rgba(0,0,0,0.3);
      background: linear-gradient(135deg, #fff 0%, #e0f7ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header p { 
      font-size: 15px; 
      opacity: 0.95; 
      letter-spacing: 0.4px;
      font-weight: 400;
      text-shadow: 0 1px 8px rgba(0,0,0,0.2);
    }

    .lang-bar {
      position: absolute; 
      top: 15px; 
      right: 15px;
      z-index: 10;
      display: flex;
      gap: 8px;
    }

    .lang-bar button {
      padding: 6px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.2);
      color: white; 
      font-weight: 600;
      cursor: pointer;
      font-size: 13px; 
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      text-shadow: 0 1px 5px rgba(0,0,0,0.2);
    }

    .lang-bar button:hover {
      background: rgba(255,255,255,0.4);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .lang-bar button.active { 
      background: rgba(255,255,255,0.5); 
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      animation: buttonPulse 2s infinite;
    }

    @keyframes buttonPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    #chat {
      flex: 1; 
      overflow-y: auto; 
      padding: 20px; 
      background: rgba(248, 250, 251, 0.6);
      scroll-behavior: smooth;
      position: relative;
    }

    #chat::-webkit-scrollbar { 
      width: 6px; 
      border-radius: 10px;
    }

    #chat::-webkit-scrollbar-thumb { 
      background: rgba(0, 180, 219, 0.5); 
      border-radius: 10px;
      animation: scrollThumbGlow 2s infinite alternate;
    }

    @keyframes scrollThumbGlow {
      0% { background: rgba(0, 180, 219, 0.5); }
      100% { background: rgba(0, 180, 219, 0.8); }
    }

    .msg { 
      margin-bottom: 20px; 
      animation: messageSlide 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    @keyframes messageSlide {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.9);
        filter: blur(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    .msg-content {
      display: inline-block;
      max-width: 80%;
      padding: 14px 18px;
      border-radius: 20px;
      font-size: 15.5px;
      word-break: break-word;
      line-height: 1.5;
      position: relative;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .msg-content:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }

    .user { 
      text-align: right;
    }

    .user .msg-content {
      background: var(--ai-gradient);
      color: white;
      border-bottom-right-radius: 8px;
      box-shadow: 0 6px 25px rgba(0, 180, 219, 0.4);
      animation: userMessageGlow 2s infinite alternate;
    }

    @keyframes userMessageGlow {
      0% { box-shadow: 0 6px 25px rgba(0, 180, 219, 0.4); }
      100% { box-shadow: 0 6px 30px rgba(0, 180, 219, 0.7); }
    }

    .bot { 
      text-align: left;
    }

    .bot .msg-content {
      background: rgba(255, 255, 255, 0.9);
      color: #2d3748;
      border: 1px solid rgba(255,255,255,0.6);
      border-bottom-left-radius: 8px;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.1);
      animation: botMessageGlow 3s infinite alternate;
    }

    @keyframes botMessageGlow {
      0% { box-shadow: 0 6px 25px rgba(0, 0, 0, 0.1); }
      100% { box-shadow: 0 6px 30px rgba(0, 180, 219, 0.2); }
    }

    .typing-indicator { 
      display: none; 
      text-align: left;
      margin-bottom: 16px;
      animation: typingPulse 1.5s ease-in-out infinite;
    }

    @keyframes typingPulse {
      0%, 100% { opacity: 0.6; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1); }
    }

    .typing-indicator.active { display: block; }

    .typing-indicator .msg-content {
      background: rgba(255, 255, 255, 0.8);
      padding: 14px 18px;
      border-radius: 20px;
      border-bottom-left-radius: 8px;
      animation: typingGlow 2s infinite alternate;
    }

    @keyframes typingGlow {
      0% { box-shadow: 0 4px 20px rgba(0, 180, 219, 0.3); }
      100% { box-shadow: 0 4px 25px rgba(0, 180, 219, 0.6); }
    }

    .typing-dots {
      display: flex;
      gap: 6px;
    }

    .typing-dots span {
      width: 10px;
      height: 10px;
      background: var(--ai-gradient);
      border-radius: 50%;
      animation: typingBounce 1.4s ease-in-out infinite both;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.16s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.32s; }

    @keyframes typingBounce {
      0%, 80%, 100% { 
        transform: scale(0.8);
        opacity: 0.5;
      }
      40% { 
        transform: scale(1.2);
        opacity: 1;
      }
    }

    .input-area {
      padding: 20px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(25px);
      border-top: 1px solid rgba(255,255,255,0.4);
      display: flex;
      gap: 12px;
      align-items: center;
    }

    #userInput {
      flex: 1;
      padding: 15px 20px;
      border: 2px solid rgba(255,255,255,0.6);
      border-radius: 25px;
      font-size: 15px;
      background: rgba(255,255,255,0.9);
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      animation: inputGlow 4s infinite alternate;
    }

    @keyframes inputGlow {
      0% { box-shadow: 0 0 0 0 rgba(0, 180, 219, 0.2); }
      100% { box-shadow: 0 0 0 5px rgba(0, 180, 219, 0.1); }
    }

    #userInput:focus {
      border-color: #00b4db;
      box-shadow: 0 0 0 3px rgba(0, 180, 219, 0.3);
      background: white;
      transform: translateY(-2px);
    }

    button {
      background: var(--ai-gradient);
      color: white;
      border: none;
      padding: 14px 25px;
      border-radius: 25px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 6px 25px rgba(0, 180, 219, 0.4);
      position: relative;
      overflow: hidden;
      animation: buttonFloat 3s ease-in-out infinite;
    }

    @keyframes buttonFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      transition: left 0.5s;
    }

    button:hover::before {
      left: 100%;
    }

    button:hover:not(:disabled) {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 10px 35px rgba(0, 180, 219, 0.6);
    }

    .history-btn-main {
      background: linear-gradient(135deg, #ff9ff3, #f368e0) !important;
      margin-left: 7px;
    }

    .welcome-msg {
      text-align: center;
      color: #4a5568;
      padding: 50px 20px 30px 20px;
      font-size: 15px;
      animation: welcomeFade 1.5s ease-out;
    }

    @keyframes welcomeFade {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.9);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .welcome-msg svg {
      width: 70px;
      height: 70px;
      margin-bottom: 15px;
      opacity: 0.8;
      animation: iconFloat 4s ease-in-out infinite;
      filter: drop-shadow(0 5px 15px rgba(0, 180, 219, 0.5));
    }

    @keyframes iconFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      33% { transform: translateY(-10px) rotate(5deg); }
      66% { transform: translateY(5px) rotate(-5deg); }
    }

    @media (max-width: 530px) {
      .container {
        height: 100vh;
        max-width: 100vw;
        border-radius: 0;
      }
      
      body {
        padding: 0;
      }

      .history-panel {
        width: 95%;
        height: 90vh;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- Overlay pour l'historique -->
  <div class="history-overlay" id="historyOverlay">
    <div class="history-panel">
      <div class="history-header">
        <h2>📊 Historique de Conversation</h2>
        <button class="history-close" onclick="closeHistory()">✕ Fermer</button>
      </div>
      
      <div class="history-content" id="historyContent">
        <!-- Le contenu de l'historique sera chargé ici -->
      </div>
    </div>
  </div>

  <!-- Container principal -->
  <div class="container">
    <div class="lang-bar">
      <button id="frBtn" class="active" onclick="switchLang('fr')">FR</button>
      <button id="enBtn" onclick="switchLang('en')">ENG</button>
    </div>
    
    <div class="header">
      <h2 id="title">🤖 Assistant IA</h2>
      <p id="subtitle">Pose-moi n'importe quelle question !</p>
    </div>
    
    <div id="chat">
      <div class="welcome-msg" id="welcomeMsg">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
        </svg>
        <p id="welcomeText">Commence la conversation en bas 👇</p>
      </div>
    </div>
    
    <div class="typing-indicator">
      <div class="msg-content">
        <div class="typing-dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
    
    <div class="input-area">
      <input type="text" id="userInput" placeholder="Tapez votre message..." autofocus />
      <button id="sendBtn" onclick="sendMsg()">Envoyer</button>
      <button type="button" class="history-btn-main" onclick="showHistory()">📊 Historique</button>
      <button type="button" style="margin-left:7px;background:rgba(193, 219, 246, 0.9);color:#394;" onclick="clearChatHistory()">🔄</button>
    </div>
  </div>

  <script>
    // Variables globales
    let sessionId = localStorage.getItem('chatSessionId') || generateSessionId();
    let currentHistory = [];
    
    // Générer un ID de session unique
    function generateSessionId() {
      const newId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
      localStorage.setItem('chatSessionId', newId);
      return newId;
    }

    // Éléments DOM
    const chat = document.getElementById('chat');            
    const userInput = document.getElementById('userInput');   
    const sendBtn = document.getElementById('sendBtn');     
    const typingIndicator = document.querySelector('.typing-indicator'); 
    const frBtn = document.getElementById('frBtn');          
    const enBtn = document.getElementById('enBtn');       
    const subtitle = document.getElementById('subtitle');
    const title = document.getElementById('title');
    const welcomeText = document.getElementById('welcomeText');
    const welcomeMsgBox = document.getElementById('welcomeMsg');
    const historyOverlay = document.getElementById('historyOverlay');
    const historyContent = document.getElementById('historyContent');

    // Textes multilingues
    const texts = {
      fr: {
        title: "🤖 Assistant IA",
        subtitle: "Pose-moi n'importe quelle question !",
        welcome: "Commence la conversation en bas 👇",
        placeholder: "Tapez votre message...",
        send: "Envoyer",
        history: "Historique",
        historyTitle: "📊 Historique de Conversation",
        totalMessages: "Messages totaux",
        userMessages: "Messages utilisateur",
        assistantMessages: "Messages assistant",
        firstMessage: "Premier message",
        lastMessage: "Dernier message",
        exportHistory: "📥 Exporter",
        clearHistory: "🗑️ Effacer",
        noHistory: "Aucun historique disponible",
        close: "Fermer"
      },
      en: {
        title: "🤖 AI Assistant",
        subtitle: "Ask me anything!",
        welcome: "Start the conversation below 👇",
        placeholder: "Type your message...",
        send: "Send",
        history: "History",
        historyTitle: "📊 Conversation History",
        totalMessages: "Total messages",
        userMessages: "User messages",
        assistantMessages: "Assistant messages",
        firstMessage: "First message",
        lastMessage: "Last message",
        exportHistory: "📥 Export",
        clearHistory: "🗑️ Clear",
        noHistory: "No history available",
        close: "Close"
      }
    };

    let currentLang = 'fr';

    function switchLang(lang) {
      currentLang = lang;
      frBtn.classList.toggle('active', lang=='fr');
      enBtn.classList.toggle('active', lang=='en');
      title.textContent        = texts[lang].title;
      subtitle.textContent     = texts[lang].subtitle;
      welcomeText.textContent  = texts[lang].welcome;
      userInput.placeholder    = texts[lang].placeholder;
      sendBtn.textContent      = texts[lang].send;
      document.querySelector('.history-btn-main').textContent = texts[lang].history;
      localStorage.setItem('chatLang', lang);
    }

    // Fonctions d'historique
    async function showHistory() {
      try {
        const response = await fetch(`/history/${sessionId}`);
        const data = await response.json();
        
        if (response.ok) {
          currentHistory = data.history;
          displayHistory(data.history, data.stats);
          historyOverlay.classList.add('active');
        } else {
          alert('Erreur lors du chargement de l\'historique');
        }
      } catch (error) {
        console.error('Erreur:', error);
        alert('Impossible de charger l\'historique');
      }
    }

    function closeHistory() {
      historyOverlay.classList.remove('active');
    }

    function displayHistory(history, stats) {
      const lang = currentLang;
      
      let html = `
        <div class="history-stats">
          <h3>📈 Statistiques</h3>
          <div class="stats-grid">
            <div class="stat-item">
              <div class="stat-value">${stats?.total_messages || 0}</div>
              <div class="stat-label">${texts[lang].totalMessages}</div>
            </div>
            <div class="stat-item">
              <div class="stat-value">${stats?.user_messages || 0}</div>
              <div class="stat-label">${texts[lang].userMessages}</div>
            </div>
            <div class="stat-item">
              <div class="stat-value">${stats?.assistant_messages || 0}</div>
              <div class="stat-label">${texts[lang].assistantMessages}</div>
            </div>
          </div>
        </div>
      `;

      if (history && history.length > 0) {
        html += `<div class="history-messages">`;
        
        history.forEach((message, index) => {
          const timestamp = new Date(message.timestamp).toLocaleString();
          const roleClass = message.role === 'user' ? 'user' : 'assistant';
          const roleLabel = message.role === 'user' ? '👤 Vous' : '🤖 Assistant';
          
          html += `
            <div class="history-message ${roleClass}">
              <div class="timestamp">${timestamp} - ${roleLabel}</div>
              <div class="content">${message.content}</div>
            </div>
          `;
        });
        
        html += `</div>`;
        
        // Boutons d'action
        html += `
          <div class="history-actions">
            <button class="history-btn export" onclick="exportHistory()">${texts[lang].exportHistory}</button>
            <button class="history-btn clear" onclick="clearHistory()">${texts[lang].clearHistory}</button>
          </div>
        `;
      } else {
        html += `<div style="text-align: center; padding: 40px; color: #666;">${texts[lang].noHistory}</div>`;
      }
      
      historyContent.innerHTML = html;
    }

    async function exportHistory() {
      try {
        const response = await fetch(`/history/${sessionId}/export`);
        const data = await response.json();
        
        if (response.ok) {
          // Créer et télécharger le fichier
          const blob = new Blob([data.export_text], { type: 'text/plain' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `historique-chat-${sessionId}.txt`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }
      } catch (error) {
        console.error('Erreur export:', error);
        alert('Erreur lors de l\'export');
      }
    }

    async function clearHistory() {
      if (confirm('Êtes-vous sûr de vouloir effacer tout l\'historique ?')) {
        try {
          const response = await fetch(`/history/${sessionId}/clear`, { method: 'DELETE' });
          
          if (response.ok) {
            alert('Historique effacé avec succès');
            closeHistory();
            // Recharger la conversation actuelle
            location.reload();
          }
        } catch (error) {
          console.error('Erreur effacement:', error);
          alert('Erreur lors de l\'effacement');
        }
      }
    }

    // Fonctions de chat existantes
    window.onload = function() {
      loadChatHistory(); 
      const lastLang = localStorage.getItem('chatLang') || 'fr';
      switchLang(lastLang);
    }

    function saveChatHistory() {
      localStorage.setItem('chatHistory', chat.innerHTML);
    }

    function loadChatHistory() {
      const history = localStorage.getItem('chatHistory');
      if (history) {
        chat.innerHTML = history;
        const oldWelcome = chat.querySelector('.welcome-msg');
        if (oldWelcome) oldWelcome.remove();
      }
    }

    function clearChatHistory() {
      if (confirm('Effacer l\'historique de cette session ?')) {
        localStorage.removeItem('chatHistory');
        chat.innerHTML = `
          <div class="welcome-msg" id="welcomeMsg">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
            </svg>
            <p id="welcomeText"></p>
          </div>
        `;
        const lastLang = localStorage.getItem('chatLang') || 'fr';
        switchLang(lastLang);
        saveChatHistory();
      }
    }

    function appendMessage(text, cls) {
      const oldWelcome = chat.querySelector('.welcome-msg');
      if (oldWelcome) oldWelcome.remove();

      const msg = document.createElement('div');
      msg.className = "msg " + cls;
      const content = document.createElement('div');
      content.className = "msg-content";
      if (cls.includes('bot')){
        content.innerHTML = marked.parse(text);
      } else {
        content.textContent = text; 
      }
      msg.appendChild(content);
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
      saveChatHistory();
    }

    function showTyping() {
      typingIndicator.classList.add('active');
      chat.scrollTop = chat.scrollHeight;
    }

    function hideTyping() {
      typingIndicator.classList.remove('active');
    }

    async function sendMsg() {
      const msg = userInput.value.trim();
      if (!msg) return; 
      
      appendMessage(msg, "user");
      userInput.value = '';
      userInput.disabled = true;
      sendBtn.disabled = true;
      showTyping();

      try {
        const response = await fetch('/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            message: msg,
            session_id: sessionId
          })
        });
        
        const data = await response.json();
        hideTyping();
        
        setTimeout(() => {
          appendMessage(data.reply, "bot");
        }, 300);
        
      } catch (error) {
        hideTyping();
        setTimeout(() => {
          appendMessage(frBtn.classList.contains('active') ?
            "Oups... une erreur technique s'est produite !" :
            "Oops... technical error occurred!", "bot");
        }, 300);
      } finally {
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
      }
    }

    userInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter' && !userInput.disabled) {
        sendMsg();
      }
    });

    // Fermer l'historique avec ESC
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && historyOverlay.classList.contains('active')) {
        closeHistory();
      }
    });

    // Fermer l'historique en cliquant à l'extérieur
    historyOverlay.addEventListener('click', function(e) {
      if (e.target === historyOverlay) {
        closeHistory();
      }
    });
  </script>
</body>
</html>
